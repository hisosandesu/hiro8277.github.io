// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  // Apply CMake flags to all subprojects to suppress deprecated API warnings
  afterEvaluate { project ->
    if (project.extensions.findByName('android') && project.android.defaultConfig?.externalNativeBuild?.cmake) {
      project.android.defaultConfig.externalNativeBuild.cmake.cppFlags "-Wno-error=deprecated-declarations"
    }
  }
}

// Re-apply patches before Gradle build to ensure patched sources are used
gradle.projectsEvaluated {
  def patchTask = tasks.register("applyPatchPackage") {
    doLast {
      def projectRoot = rootDir.parentFile
      def patchesDir = new File(projectRoot, "patches")
      if (patchesDir.exists() && patchesDir.listFiles()?.length > 0) {
        println "[patch-package] Re-applying patches before build..."
        exec {
          workingDir projectRoot
          commandLine "npx", "patch-package", "--patch-dir", "patches"
        }
        println "[patch-package] Patches applied successfully"
      }
    }
  }
  rootProject.subprojects { sub ->
    sub.tasks.matching { it.name == "preBuild" }.configureEach {
      dependsOn patchTask
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
